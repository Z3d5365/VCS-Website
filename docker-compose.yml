# ZZ Digital portal — run on the EC2 box from the repo root:
#   docker compose up -d --build
# Runs Postgres + the API + auto-HTTPS. Serves https://portal.zzdigitaldesign.com/portal/
# Set DB_PASSWORD and JWT_SECRET in a .env file next to this one (see .env.example at repo root).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zz
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: zzportal
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zz -d zzportal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://zz:${DB_PASSWORD}@db:5432/zzportal
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "1"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ap-southeast-1
      UPLOADS_BUCKET: vibecraftedsoftware-client-uploads
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it:free}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
