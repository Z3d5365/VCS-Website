<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Vibe Crafted</title>
<meta name="description" content="Search every page on the Vibe Crafted site — services, pricing, process and FAQs.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://websites.vibecraftedsoftware.com/search/">
<link rel="alternate" hreflang="en" href="https://websites.vibecraftedsoftware.com/search/">
<link rel="alternate" hreflang="th" href="https://websites.vibecraftedsoftware.com/th/search/">
<meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230C0C0C'/><polygon fill='%23fff' points='8,10 31.5,10 50,68.5 68.5,10 92,10 50,92'/><polyline fill='none' stroke='%230C0C0C' stroke-width='5.5' points='16.5,49 33,38.5 50,55.5 67,39 83.5,50.5'/></svg>">
<script>/* set the theme before first paint so the page never flashes */
(()=>{try{var t=localStorage.getItem("zz-theme");if(t)document.documentElement.dataset.theme=t;}catch{}})();</script>
<link rel="stylesheet" href="/assets/service.css">
</head>
<body>

<header class="header">
  <div class="shell bar">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h11L7 17h11"/></svg></span>
      Vibe Crafted
    </a>
    <nav class="nav">
      <a class="hide" href="/#services">Services</a>
      <a class="hide" href="/#pricing">Pricing</a>
      <span class="pill" aria-label="Language">
        <a class="on" href="/search/" data-lang="en" hreflang="en">EN</a>
        <a href="/th/search/" data-lang="th" hreflang="th">ไทย</a>
      </span>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch colour theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="shell search-main">
  <h1>Search</h1>

  <form class="search-form" id="search-form" role="search" action="/search/" method="get">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <label class="visually-hidden" for="q" style="position:absolute;left:-9999px">Search the site</label>
    <input id="q" name="q" type="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="Search the site…">
  </form>

  <p class="search-status" id="search-status" role="status" aria-live="polite"></p>
  <div class="search-results" id="search-results"></div>
</main>

<footer><div class="shell">© <span id="year">2026</span> ZZDigital · Hand-built, start to finish · <a href="/">Home</a> · <a href="/#pricing">Pricing</a> · <a href="/#faq">FAQ</a></div></footer>

<script src="/assets/search.js"></script>
<script>
(() => { "use strict";
  const store={get(k){try{return localStorage.getItem(k);}catch{return null;}},set(k,v){try{localStorage.setItem(k,v);}catch{}}};
  const root=document.documentElement; root.dataset.theme=store.get("zz-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const t=document.getElementById("theme"); if(t)t.addEventListener("click",()=>{const n=root.dataset.theme==="dark"?"light":"dark";store.set("zz-theme",n);root.dataset.theme=n;});
  document.querySelectorAll(".pill a").forEach(a=>a.addEventListener("click",()=>store.set("zz-lang",a.dataset.lang)));
  const y=document.getElementById("year"); if(y)y.textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
