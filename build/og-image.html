<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: #0a0a0f;
    color: #f4f3f8;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(700px 500px at 82% 18%, rgba(139,92,246,.34), transparent 60%),
      radial-gradient(620px 460px at 12% 96%, rgba(15,184,148,.22), transparent 60%);
  }
  .grid {
    position: absolute; inset: 0; opacity: .06;
    background-image:
      linear-gradient(to right, #fff 1px, transparent 1px),
      linear-gradient(to bottom, #fff 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .wrap { position: relative; height: 100%; padding: 76px 84px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .mark {
    width: 68px; height: 68px; border-radius: 18px;
    background: linear-gradient(135deg, #6d5efc, #8b5cf6 40%, #0fb894);
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 40px; height: 40px; }
  .brand b { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
  h1 {
    margin-top: auto;
    font-size: 92px; line-height: 1.02; letter-spacing: -.035em; font-weight: 720;
  }
  h1 .grad {
    background: linear-gradient(100deg, #8b7dff 0%, #a78bfa 40%, #2ee0b5 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .foot { margin-top: 30px; display: flex; align-items: center; gap: 18px; font-size: 27px; color: #bdb9c9; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #0fb894; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
    background: linear-gradient(100deg, #6d5efc, #8b5cf6 40%, #0fb894); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="wrap">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h11L7 17h11"/></svg>
      </span>
      <b>ZZDigital</b>
    </div>
    <h1>Small studio.<br><span class="grad">Serious websites.</span></h1>
    <div class="foot">
      <span>Websites, logos &amp; hosting</span>
      <span class="dot"></span>
      <span>zzdigitaldesign.com</span>
    </div>
  </div>
  <div class="bar"></div>
</body>
</html>
